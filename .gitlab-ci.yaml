stages:
  - validate
  - security

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""

terraform_validate:
  image: hashicorp/terraform:latest
  stage: validate
  script:
    - terraform init -backend=false
    - terraform fmt -check
    - terraform validate

trivy_scan:
  image: docker:latest
  stage: security
  services:
    - docker:dind
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
  script:
    - docker pull nginx:latest
    - ./bin/trivy image --severity HIGH,CRITICAL nginx:latest