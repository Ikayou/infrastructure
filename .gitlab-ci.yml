stages:
  - validate
  - build
  - security

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA

terraform_validate:
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  stage: validate
  script:
    - terraform init -backend=false
    - terraform fmt -check
    - terraform validate

docker_build:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" $CI_REGISTRY --password-stdin
  script:
    - docker build -t $IMAGE_NAME ./backend
    - docker push $IMAGE_NAME

trivy_scan:
  needs:
    - docker_build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  stage: security
  script:
    - trivy image --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_NAME"

sbom:
  needs:
    - docker_build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  stage: security
  script:
    - trivy image --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" --format cyclonedx --output sbom.json "$IMAGE_NAME"
  artifacts:
    paths:
      - sbom.json
    expire_in: 1 week

healthcheck_note:
  image: alpine:latest
  stage: validate
  script:
    - echo "Healthcheck endpoint is implemented at /health"